# Server links which are sent to players in the options menu.
# Component supports minimessage.
# Order is as shown in list menu. (Lower number higher up)
links:
  - component: "<rainbow>made you look lol</rainbow>"
    uri: "https://www.youtube.com/watch?v=dQw4w9WgXcQ"
    order: 0

# Server resource packs which are applied on join.
# github-url: Base URL of the GitHub repository (e.g. https://github.com/Owner/repo).
# branch:     The tag prefix to match releases against (e.g. "master" matches tags like "master-v64").
# zip-name:   The asset filename to download from the matching release (e.g. "cloudie-s10-RP.zip").
# priority:   Pack stack order; higher number = higher priority.
resource-packs:
  - github-url: "https://github.com/CloudieSMP/resourcepack-s10"
    branch: master
    zip-name: "cloudie-s10-RP.zip"
    priority: 100

# Server MOTD displayed in the server list. Supports MiniMessage.
motd: |-
  <gradient:#DF6F69:#C45889:#823BC6>          --- Cloudie SMP ☁ Season 10! ---</gradient>
  <cloudiecolor>                   ╰┈➤Join today! V26.1</cloudiecolor>

discord:
  # Webhook URL for player reports. Leave empty to disable.
  report-webhook-url: ""

afk:
  # Time in seconds before a player is automatically marked as AFK.
  idle-timeout-seconds: 300

rain-crop-growth:
  # Chance (0.0–1.0) that a crop exposed to open sky receives an extra growth tick
  # during rain. Set to 0.0 to disable.
  boost-chance: 0.25

show-stat:
  # How long each scoreboard page is shown, in seconds.
  seconds-per-page: 7

tag-your-it:
  cooldown-seconds: 30
  # How long (in seconds) before a player can tag back the person who tagged them. Default: 86400 (24 hours).
  cooldown-back-tagging-seconds: 86400